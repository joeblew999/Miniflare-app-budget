# Secrets and environment variables for this project.
# Values are NOT stored here. Each person points these names at their own store
# in fnox.local.toml (gitignored), e.g. their keychain, 1Password or age.
# Commands that need them run through `fnox exec` (see package.json).

[secrets]
# Cloudflare account to deploy into (worker:deploy)
CLOUDFLARE_ACCOUNT_ID = { description = "Cloudflare account ID", if_missing = "warn" }
# API token with Workers Scripts:Edit (worker:deploy)
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token (Workers Scripts:Edit)", if_missing = "warn" }
