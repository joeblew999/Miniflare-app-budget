# Secrets and environment variables for this project: names only, never real values.
# Each person points these names at their own store (keychain, 1Password, age…) in
# fnox.local.toml, which is gitignored. The CLI runs commands through `fnox exec`.

# Built-in provider for the dev-only default below. Add your real stores in fnox.local.toml.
[providers.plain]
type = "plain"

# Used by local dev and tests (app:dev, app:preview, test:run).
[secrets]
# Signs session cookies. This default is for local dev and tests only; worker:ci refuses
# to deploy with it. Cloudflare gets random values from `npm run worker:setup`.
BETTER_AUTH_SECRET = { description = "Better Auth secret (32+ random chars)", default = "local-dev-only-secret-do-not-deploy-0000" }

# The CLI's Cloudflare commands (worker:setup, worker:build, worker:status, worker:logs,
# worker:deploy, db:migrate --remote) run under this profile. Point these at your own
# store in fnox.local.toml. The API token needs: Workers Scripts Edit, D1 Edit,
# Workers Builds Configuration Edit, Account Settings Read.
[profiles.production.secrets]
CLOUDFLARE_ACCOUNT_ID = { description = "Cloudflare account ID", if_missing = "warn" }
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token (see permissions above)", if_missing = "warn" }
